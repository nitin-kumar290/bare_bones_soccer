<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>World Cup Block Party — Teaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: #050e05;
}

.wcp-teaser {
    font-family: 'Oswald', sans-serif;
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── Hero ── */
.wcp-hero {
    position: relative;
    background: #050e05;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Grid lines */
.wcp-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        repeating-linear-gradient(0deg,  transparent, transparent 79px, rgba(255,255,255,0.04) 80px),
        repeating-linear-gradient(90deg, transparent, transparent 79px, rgba(255,255,255,0.04) 80px);
    pointer-events: none;
}

/* Stadium spotlight */
.wcp-spotlight {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 900px; height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,215,0,0.07) 0%, transparent 65%);
    pointer-events: none;
}

/* Center circle */
.wcp-field-circle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 820px; height: 820px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.06);
    pointer-events: none;
}

/* Center line */
.wcp-field-line {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 1px;
    background: rgba(255,255,255,0.04);
    pointer-events: none;
}

/* ── Flags ── */
.wcp-flags-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}
.wcp-flags-bg span {
    position: absolute;
    display: block;
    line-height: 1;
    animation: wcp-flag-float 6s ease-in-out infinite;
}
@keyframes wcp-flag-float {
    0%,  100% { translate: 0 0; }
    50%        { translate: 0 -14px; }
}

/* ── Copy ── */
.wcp-inner {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 60px;
}

.wcp-eyebrow {
    display: block;
    font-size: 20px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 36px;
}

.wcp-main-title {
    margin: 0 0 16px;
    line-height: 0.9;
}
.wcp-title-line1 {
    display: block;
    font-size: 130px;
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #fff;
}
.wcp-title-line2 {
    display: block;
    font-size: 130px;
    font-weight: 700;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #dc3545;
}

.wcp-date-block { margin: 36px 0 28px; }
.wcp-date-num {
    font-size: 88px;
    font-weight: 800;
    letter-spacing: 18px;
    color: #FFD700;
    text-shadow: 0 0 80px rgba(255,215,0,0.45);
}

.wcp-venue-line {
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin: 0 0 20px;
}
.wcp-tagline-line {
    font-size: 28px;
    font-weight: 400;
    font-style: italic;
    color: rgba(255,255,255,0.7);
    margin: 0 0 52px;
    font-family: Georgia, serif;
    line-height: 1.5;
}

.wcp-coming-badge {
    display: inline-block;
    border: 2px solid rgba(220,53,69,0.6);
    border-radius: 999px;
    padding: 18px 52px;
    font-size: 18px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #dc3545;
    animation: wcp-pulse 2.5s ease-in-out infinite;
}
@keyframes wcp-pulse {
    0%,  100% { opacity: 1;    box-shadow: 0 0 0 0    rgba(220,53,69,0.35); }
    50%        { opacity: 0.6;  box-shadow: 0 0 0 18px rgba(220,53,69,0);   }
}

/* ── Photos ── */
.wcp-photos {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 24px;
    padding: 56px 60px 72px;
    background: #0a0a0a;
    flex-shrink: 0;
}

.wcp-photo {
    flex: 0 0 auto;
    width: 295px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 16px 50px rgba(0,0,0,0.75);
    transition: transform 0.3s ease;
}
.wcp-photo img {
    width: 100%;
    height: 340px;
    object-fit: cover;
    display: block;
    filter: brightness(0.8) saturate(0.85);
}

.wcp-photo--tilt-left  { transform: rotate(-3.5deg); }
.wcp-photo--center     { transform: translateY(-24px) scale(1.07); z-index: 2; }
.wcp-photo--tilt-right { transform: rotate(3.5deg); }

/* Bare Bones wordmark footer */
.wcp-footer {
    background: #0a0a0a;
    text-align: center;
    padding: 0 0 40px;
    font-size: 16px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
}
</style>
</head>
